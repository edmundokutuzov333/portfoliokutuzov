name: Performance
on:
  pull_request:
    branches: [main]
  push:
    branches: [phase2-final-exec]
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Start SSR development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/portfolio-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1
      - name: Collect Lighthouse desktop
        run: |
          rm -rf .lighthouseci .lighthouseci-desktop
          npx --yes @lhci/cli@0.15.1 collect --config=lighthouserc.cjs
      - name: Assert Lighthouse desktop
        id: desktop_assert
        continue-on-error: true
        run: |
          set +e
          npx --yes @lhci/cli@0.15.1 assert --config=lighthouserc.cjs
          status=$?
          echo "$status" > /tmp/lighthouse-desktop-assert-status
          exit 0
      - name: Preserve desktop reports
        if: always()
        run: mv .lighthouseci .lighthouseci-desktop 2>/dev/null || true
      - name: Collect Lighthouse mobile
        run: |
          rm -rf .lighthouseci
          npx --yes @lhci/cli@0.15.1 collect --config=lighthouserc.mobile.cjs
      - name: Assert Lighthouse mobile
        id: mobile_assert
        continue-on-error: true
        run: |
          set +e
          npx --yes @lhci/cli@0.15.1 assert --config=lighthouserc.mobile.cjs
          status=$?
          echo "$status" > /tmp/lighthouse-mobile-assert-status
          exit 0
      - name: Preserve mobile reports
        if: always()
        run: mv .lighthouseci .lighthouseci-mobile 2>/dev/null || true
      - name: Inspect Lighthouse reports
        if: always()
        run: |
          node scripts/inspect-lighthouse.mjs .lighthouseci-desktop || true
          node scripts/inspect-lighthouse.mjs .lighthouseci-mobile || true
      - name: Enforce Lighthouse gates
        if: always()
        run: |
          desktop_status=$(cat /tmp/lighthouse-desktop-assert-status 2>/dev/null || echo 1)
          mobile_status=$(cat /tmp/lighthouse-mobile-assert-status 2>/dev/null || echo 1)
          echo "Desktop assertion exit: $desktop_status"
          echo "Mobile assertion exit: $mobile_status"
          if [ "$desktop_status" != "0" ] || [ "$mobile_status" != "0" ]; then
            exit 1
          fi
      - if: always()
        name: Upload Lighthouse reports
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: .lighthouseci-*
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        name: Server log
        run: cat /tmp/portfolio-server.log || true
