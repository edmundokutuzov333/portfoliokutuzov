name: Performance
on:
  pull_request:
    branches: [main, phase3-ai-intelligence]
  push:
    branches: [phase2-final-exec, phase3-ai-intelligence, ai-realtime-i18n]
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Start SSR development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 3000 > /tmp/portfolio-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-server.log
          exit 1
      - name: Collect Lighthouse desktop
        run: |
          rm -rf .lighthouseci .lighthouseci-desktop
          npx --yes @lhci/cli@0.15.1 collect --config=lighthouserc.cjs
      - name: Assert Lighthouse desktop
        run: npx --yes @lhci/cli@0.15.1 assert --config=lighthouserc.cjs
      - name: Preserve desktop reports
        if: always()
        run: cp -R .lighthouseci .lighthouseci-desktop || true
      - name: Collect Lighthouse mobile
        run: |
          rm -rf .lighthouseci
          npx --yes @lhci/cli@0.15.1 collect --config=lighthouserc.mobile.cjs
      - name: Assert Lighthouse mobile
        run: npx --yes @lhci/cli@0.15.1 assert --config=lighthouserc.mobile.cjs
      - name: Preserve mobile reports
        if: always()
        run: cp -R .lighthouseci .lighthouseci-mobile || true
      - name: Inspect Lighthouse reports
        if: always()
        run: node scripts/inspect-lighthouse.mjs .lighthouseci-desktop .lighthouseci-mobile
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci-desktop
            .lighthouseci-mobile
      - name: Server log
        if: always()
        run: cat /tmp/portfolio-server.log || true
