name: Admin source cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase1-hardening' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          fetch-depth: 1

      - name: Remove legacy mock branch from admin route
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/routes/admin.lazy.tsx")
          text = path.read_text(encoding="utf-8")
          start = text.index('    const normalizedEmail = email.trim().toLowerCase();')
          end = text.index('    const { error } = await supabase.auth.signInWithPassword', start)
          replacement = '    const { error } = await supabase.auth.signInWithPassword({ email, password });\n'
          text = text[:start] + replacement + text[end + len(replacement):]
          text = text.replace('            localStorage.removeItem("mock_admin_email");\n', '')
          path.write_text(text, encoding="utf-8")

      - name: Commit cleanup
        run: |
          if git diff --quiet -- src/routes/admin.lazy.tsx; then
            echo "No admin source cleanup needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/admin.lazy.tsx
          git commit -m "security(admin): remove legacy mock auth"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
