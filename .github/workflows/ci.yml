name: CI
on:
  push:
    branches:
      - awwwards-rebuild
      - main
      - phase1-hardening
      - phase2-final-exec
      - phase3-ai-intelligence
      - ai-realtime-i18n
      - feat/studio-identity-email
      - feat/studio-admin-phase-g
      - feat/studio-qa-final
  pull_request:
    branches: [main, phase3-ai-intelligence]
permissions:
  contents: read

concurrency:
  group: control-room-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - name: Verify runtime declaration
        run: |
          test "$(cat .nvmrc | tr -d '\n\r')" = "24"
          node -e "const p=require('./package.json'); if(p.engines?.node!=='24.x') process.exit(1)"
      - name: Install
        run: npm ci
      - name: Diagnostics
        run: npm run diagnose
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Regression tests
        run: npm test
      - name: Contrast token gate
        run: npm run contrast:check
      - name: Foundation parity
        run: npm run test:parity
      - name: Foundation change gate
        run: npm run test:change-gate
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Performance budget
        run: npm run test:performance
      - name: Playwright smoke
        run: npx playwright test tests/browser/portfolio.spec.ts tests/browser/case-study.spec.ts tests/browser/services.spec.ts tests/browser/credentials.spec.ts tests/browser/contact.spec.ts --project=chromium --grep "home renders|portfolio archive renders|contact page validates|case study|services|credentials|contact renders|contact validates|contact preserves|contact draft|contact uses"
