name: CI

on:
  push:
    branches: [main, phase1-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify runtime declaration
        run: |
          test "$(cat .nvmrc | tr -d '\n\r')" = "24"
          node -e "const p=require('./package.json'); if(p.engines?.node!=='24.x') process.exit(1)"

      - name: Install
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Diagnostics
        run: npm run diagnose

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
