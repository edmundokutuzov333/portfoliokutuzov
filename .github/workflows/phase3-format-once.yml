name: Phase 3 Format Once

on:
  push:
    branches: [phase3-ai-intelligence]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore(format): Phase 3 sources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Format Phase 3 sources
        run: |
          npx prettier --write \
            src/components/CommandPalette.tsx \
            src/components/ContactDraftRecovery.tsx \
            src/components/ContextualRelatedWork.tsx \
            src/components/ProjectEntitySchema.tsx \
            src/config/server.ts \
            src/lib/ai/agent.ts \
            src/lib/ai/config.ts \
            src/lib/ai/knowledge-layer.ts \
            src/lib/briefing.functions.ts \
            src/lib/design-system.ts \
            src/lib/observability.ts \
            src/routes/__root.tsx \
            src/routes/api.chat.ts \
            tests/browser/portfolio.spec.ts \
            tests/phase3-intelligence.test.mjs
      - name: Commit formatted files and remove formatter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/CommandPalette.tsx \
            src/components/ContactDraftRecovery.tsx \
            src/components/ContextualRelatedWork.tsx \
            src/components/ProjectEntitySchema.tsx \
            src/config/server.ts \
            src/lib/ai/agent.ts \
            src/lib/ai/config.ts \
            src/lib/ai/knowledge-layer.ts \
            src/lib/briefing.functions.ts \
            src/lib/design-system.ts \
            src/lib/observability.ts \
            src/routes/__root.tsx \
            src/routes/api.chat.ts \
            tests/browser/portfolio.spec.ts \
            tests/phase3-intelligence.test.mjs \
            .github/workflows/phase3-format-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(format): Phase 3 sources"
          git push origin HEAD:phase3-ai-intelligence
