name: Phase 2 repair
on:
  push:
    branches: [phase2-final-exec]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply deterministic type repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/ai/agent.ts')
          s = p.read_text()
          old = '  messages: ChatMessage[],\n  context: ChatContext,'
          new = '  messages: ChatMessage[] | undefined,\n  context: ChatContext,'
          if old not in s:
              raise SystemExit('agent signature pattern not found')
          s = s.replace(old, new, 1)
          marker = '): Promise<void> {\n  const session = getOrCreateSession(sessionId, context);'
          replacement = '): Promise<void> {\n  messages = messages ?? [];\n  const session = getOrCreateSession(sessionId, context);'
          if marker not in s:
              raise SystemExit('agent initialization pattern not found')
          p.write_text(s.replace(marker, replacement, 1))
          Path('src/components/ui/popover.tsx').unlink(missing_ok=True)
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/ai/agent.ts src/components/ui/popover.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: clear remaining phase 2 typecheck blockers'
          git push
