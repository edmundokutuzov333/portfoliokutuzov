name: One-time hardening formatter

on:
  push:
    branches:
      - feat/portfolio-hardening-studio-construction
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format hardening files
        run: >
          npx prettier --write
          README.md
          ARCHITECTURE.md
          SECURITY.md
          DEPLOY.md
          vercel.json
          .github/workflows/production-gemini-e2e.yml
          .github/workflows/supabase-backup.yml
          scripts/production-gemini-e2e.mjs
          src/config/public.ts
          src/config/server.ts
          src/integrations/supabase/client.server.ts
          src/lib/seo.ts
          src/lib/site-locale.ts
          src/lib/studio/public-launch.ts
          src/routes/__root.tsx
          src/routes/api.portfolio-projects.ts
          src/routes/api.studio-admin.ts
          src/routes/api.studio-background.ts
          src/routes/api.studio-card.ts
          src/routes/api.studio-creative.ts
          src/routes/api.studio-email.ts
          src/routes/api.studio-public-card.ts
          src/routes/api.studio-publish.ts
          src/routes/api.studio-vcard.ts
          src/routes/card.$token.tsx
          src/routes/sitemap[.]xml.ts
          src/routes/studio.tsx
          src/routes/studio.background.tsx
          src/routes/studio.business-card.tsx
          src/routes/studio.identity.tsx
          src/components/studio/BusinessCardEditor.tsx
          src/components/studio/StudioConstructionSignal.tsx
          src/styles.css
          tests/phase3-intelligence.test.mjs
          tests/portfolio-regression.test.mjs
          tests/portfolio-hardening.test.mjs
          tests/site-locale-pt-completion.test.mjs
          tests/studio-background-engine.test.mjs
          tests/studio-digital-identity.test.mjs
          tests/studio-foundation.test.mjs
          tests/browser/portfolio.spec.ts
          src/routeTree.gen.ts
      - name: Commit formatted output
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: format hardening changes [skip ci]"
          git push origin HEAD
