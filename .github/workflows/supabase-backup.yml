name: Supabase Backup

on:
  push:
    branches:
      - awwwards-rebuild
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PGSSLMODE: verify-full

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify backup secrets exist
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL repository secret" && exit 1)
          test -n "$BACKUP_ENCRYPTION_KEY" || (echo "Missing BACKUP_ENCRYPTION_KEY repository secret" && exit 1)

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump production database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          umask 077
          pg_dump --format=custom --no-owner --no-privileges "$SUPABASE_DB_URL" > supabase-backup.dump

      - name: Export Storage manifest
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          umask 077
          psql "$SUPABASE_DB_URL"             --tuples-only --no-align --field-separator 
\t'             --command "select bucket_id, name, coalesce(version,''), coalesce(metadata::text,'{}') from storage.objects order by bucket_id, name"             > storage-manifest.tsv
          sha256sum storage-manifest.tsv > storage-manifest.sha256

      - name: Package database and Storage manifest
        run: |
          umask 077
          tar -czf phase1-production-backup.tar.gz supabase-backup.dump storage-manifest.tsv storage-manifest.sha256

      - name: Encrypt backup
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          umask 077
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | openssl enc -aes-256-cbc -pbkdf2 -salt -iter 200000 -pass stdin -in phase1-production-backup.tar.gz -out phase1-production-backup.tar.gz.enc
          rm -f supabase-backup.dump storage-manifest.tsv storage-manifest.sha256 phase1-production-backup.tar.gz

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: phase1-production-backup.tar.gz.enc
          retention-days: 30
