name: temporary-site-locale-cleanup

on:
  push:
    branches:
      - fix/post-merge-quality

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate translation properties
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/lib/site-locale.ts")
          lines = path.read_text(encoding="utf-8").splitlines(True)
          output = []
          seen = set()
          inside = False
          for line in lines:
              if line.startswith("const PT_TRANSLATIONS:"):
                  inside = True
                  output.append(line)
                  continue
              if inside and line.startswith("};"):
                  inside = False
                  output.append(line)
                  continue
              if inside:
                  match = re.match(r'^\s*(?:"([^"]+)"|([A-Za-z_$][\w$]*))\s*:', line)
                  if match:
                      key = match.group(1) or match.group(2)
                      if key in seen:
                          continue
                      seen.add(key)
              output.append(line)
          path.write_text("".join(output), encoding="utf-8")
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- src/lib/site-locale.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/site-locale.ts
          git commit -m "fix: remove duplicate locale dictionary entries"
          git push
