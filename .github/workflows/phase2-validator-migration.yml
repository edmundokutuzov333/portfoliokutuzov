name: Phase 2 validator migration

on:
  push:
    branches: [phase2-production-excellence]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'phase2: migrate server validators') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Replace deprecated validator API
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('src/lib/invoice.functions.ts'),
              Path('src/lib/newsletter.functions.ts'),
              Path('src/lib/briefing.functions.ts'),
          ]
          changed = False
          for path in files:
              text = path.read_text()
              updated = text.replace('.inputValidator(', '.validator(')
              if updated != text:
                  path.write_text(updated)
                  changed = True
          if not changed:
              raise SystemExit('No validator migration required')
          PY
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/invoice.functions.ts src/lib/newsletter.functions.ts src/lib/briefing.functions.ts
          git commit -m 'phase2: migrate server validators'
          git push origin HEAD:phase2-production-excellence
