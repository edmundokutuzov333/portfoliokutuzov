name: Browser QA

on:
  pull_request:
    branches: [main, phase3-ai-intelligence]
  push:
    branches: [phase3-ai-intelligence, ai-realtime-i18n, main, feat/studio-qa-final, awwwards-rebuild]

concurrency:
  group: control-room-browser-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save @playwright/test @axe-core/playwright@4.13.0
      - run: npx playwright install --with-deps chromium firefox webkit msedge
      - run: npx playwright test
