name: Browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase3-ai-intelligence, main]

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --yes playwright install --with-deps chromium firefox webkit
      - run: npx --yes playwright test
